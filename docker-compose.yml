# ---------------------------------------------------------------------------
# IndoPolaris — local development stack
#
#   docker compose up -d          # Postgres + MinIO + ml-service
#   docker compose --profile app up --build    # ...plus the Next.js app
#
# Without Docker installed, `npm run db:pglite` starts an in-process Postgres
# (PGlite over a TCP socket) on the same port, so the app and Prisma CLI work
# unchanged. See README "Running without Docker".
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: indopolaris-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: indopolaris
      POSTGRES_PASSWORD: indopolaris_dev_pw
      POSTGRES_DB: indopolaris
      # Deterministic collation so ORDER BY doesn't drift between local and CI.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone succeeds before the init scripts finish; querying
      # the actual database is what we care about.
      test: ["CMD-SHELL", "pg_isready -U indopolaris -d indopolaris"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: indopolaris-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: indopolaris
      MINIO_ROOT_PASSWORD: indopolaris_dev_secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: creates the bucket and marks it public-read so <img src> works
  # without presigning every URL. Runs to completion, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: indopolaris-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 indopolaris indopolaris_dev_secret &&
        mc mb --ignore-existing local/indopolaris &&
        mc anonymous set download local/indopolaris &&
        echo 'MinIO bucket ready.'
      "

  # Python ML service: discipline auto-tagging (Phase 2), plus the publish-time
  # contextual bandit (Phase 7).
  #
  # `depends_on: db: service_healthy` is what Section 4 asks for — the app must
  # not boot against a database that is still running init scripts, and the
  # service must not start against one that does not exist. The healthcheck hits
  # /health rather than the TCP port, so "accepting connections but no model
  # artifact" is caught too.
  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: indopolaris-ml
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://indopolaris:indopolaris_dev_pw@db:5432/indopolaris
      MODEL_PATH: /app/models/discipline_ensemble_v1.joblib
      LOG_LEVEL: INFO
      LOG_JSON: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          try:
              sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=4).status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indopolaris-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Section 4: the web service waits for the ML service to report healthy,
      # so the first upload never races an unready classifier.
      ml-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://indopolaris:indopolaris_dev_pw@db:5432/indopolaris?schema=public
      ML_SERVICE_URL: http://ml-service:8000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/indopolaris
      S3_REGION: us-east-1
      S3_BUCKET: indopolaris
      S3_ACCESS_KEY_ID: indopolaris
      S3_SECRET_ACCESS_KEY: indopolaris_dev_secret
      S3_FORCE_PATH_STYLE: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  db-data:
  minio-data:
