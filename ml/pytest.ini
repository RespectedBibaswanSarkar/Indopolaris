[pytest]
testpaths = tests
# `ml/` on the path so `from app...` and `from tests.conftest import ...` resolve
# regardless of the working directory pytest is invoked from.
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    error
    # sklearn emits this from `LinearSVC.decision_function` paths in 1.9; it is
    # upstream and not actionable here.
    ignore::FutureWarning
